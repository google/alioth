[package]
name = "kernel"
authors = ["The Motor OS Project Developers"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[dependencies]

# internal dependencies (referenced read-only from ../motor-dev/motor-os;
# see https://github.com/moturus/motor-os/blob/main/docs/build.md)
moto-rt  = { path = "../../../motor-dev/motor-os/src/sys/lib/moto-rt" , features = ["base"] }
moto-sys = { path = "../moto-sys", default-features = false, features = ["base"] }
frusa    = { path = "../../../motor-dev/motor-os/src/sys/lib/frusa" }

# external dependencies
bitflags              = { path = "../../../motor-dev/motor-os/src/third_party/bitflags"     }
elfloader             = { path = "../../../motor-dev/motor-os/src/third_party/elfloader"    }
intrusive-collections = { path = "../../../motor-dev/motor-os/src/third_party/intrusive-rs" }
x86                   = { path = "../../../motor-dev/motor-os/src/third_party/x86"          }
x86_64                = { path = "../../../motor-dev/motor-os/src/third_party/x86_64"       }

log = "0.4.28"
xsave = "2.0.2"

# Airlock Ring-0 VMM host dependencies (ABI types + #![no_std] Wasmtime runtime; zero Cranelift)
vmm-core = { path = "../../vmm-core" }
wasmtime = { path = "../../../wasmtime/crates/wasmtime", default-features = false, features = ["runtime", "custom-sync-primitives", "threads"] }
# Force software SHA-2 in `wasmtime-environ` so `sha2` never emits SSE2/SHA-NI SIMD intrinsics under `+soft-float`.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
zerocopy = { version = "0.7.32", default-features = false, features = ["derive", "alloc"] }

[features]

[workspace]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
derive-layout = { path = "../../derive-layout" }
bitfield = "0.15.0"
bitflags = "2.4.0"
log = "0.4.28"
zerocopy = { version = "0.7.32", default-features = false, features = ["derive", "alloc"] }

[patch.crates-io]
moto-rt  = { path = "../../../motor-dev/motor-os/src/sys/lib/moto-rt" }
moto-sys = { path = "../moto-sys" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
strip = true
codegen-units = 1
