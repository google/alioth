[workspace]
resolver = "2"
members = [
    "derive-layout",
    "vmm-host",
    "vmm-runner",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
derive-layout = { path = "derive-layout" }
vmm-runner = { path = "vmm-runner" }

anyhow = "1"
bitfield = "0.15.0"
bitflags = "2.4.0"
libc = "0.2.150"
log = "0.4"
mio = { version = "0.8.8", features = ["os-poll", "os-ext", "net"] }
parking_lot = { version = "0.12" }
simplelog = "0.12.2"
thiserror = "1"
wasmtime = { version = "48.0.2", default-features = false, features = ["runtime", "threads", "std"] }
wasmtime-wasi = { version = "48.0.2", default-features = false, features = ["p1"] }
zerocopy = { version = "0.7.32", features = ["derive", "alloc"] }

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
