version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types:
          - minor
          - major
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
        prefix: "build(deps)"
    groups:
      patches:
        update-types:
          - patch
    cooldown:
      default-days: 7
