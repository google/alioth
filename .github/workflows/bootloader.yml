name: Build Bootloader

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

jobs:
  # `on.<event>.paths` is not supported by `merge_group`, and a workflow
  # skipped by path filters never reports its required checks, which blocks
  # the merge queue. Detect relevant changes in a job instead so that the
  # downstream jobs are skipped (and reported as successful) when nothing
  # relevant changed. `workflow_dispatch` and `workflow_call` runs always
  # build.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bootloader: ${{ steps.filter.outputs.bootloader }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            bootloader:
              - bootloader/config*
              - bootloader/build.sh
              - .github/workflows/bootloader.yml

  build_bootloader:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.bootloader == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "20"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev
      - name: Build bootloader
        run: ARCH=${{ matrix.arch }} ./bootloader/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-${{ matrix.arch }}
          path: target/bootloader-${{ matrix.arch }}/kernel-${{ matrix.arch }}
