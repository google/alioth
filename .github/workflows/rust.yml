name: Rust

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # `on.<event>.paths` is not supported by `merge_group`, and a workflow
  # skipped by path filters never reports its required checks, which blocks
  # the merge queue. Detect relevant changes in a job instead so that the
  # downstream jobs are skipped (and reported as successful) when nothing
  # relevant changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - "**/*.rs"
              - "**/Cargo.toml"
              - Cargo.lock
              - .github/workflows/rust.yml

  build_test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        target:
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - name: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - name: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - name: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - name: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.target.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          target: ${{ matrix.target.name }}
          components: rustfmt,llvm-tools
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          target: ${{ matrix.target.name }}
          components: clippy
      - name: Install tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov,cargo-deny
      - name: Check dependencies
        run: cargo deny check
      - name: Build
        run: cargo build --target ${{ matrix.target.name }} --verbose
      - name: Format
        run: cargo +nightly fmt --check
        if: matrix.target.name == 'x86_64-unknown-linux-gnu'
      - name: Run tests and collect coverage
        env:
          RUST_LOG: "trace"
        run: |
          cargo +nightly llvm-cov test --target ${{ matrix.target.name }} --branch \
              --workspace --ignore-filename-regex '.*_test.rs$' \
              --lcov --output-path lcov-${{ matrix.target.name }}.info
      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target.name }} -- -D warnings
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-${{ matrix.target.name }}.info
          path: lcov-${{ matrix.target.name }}.info

  upload_coverage:
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: lcov
          pattern: lcov-*.info
          merge-multiple: true
      - name: Merge coverage reports
        run: |
          sed -i 's#SF:/Users/#SF:/home/#g' lcov/*apple-darwin*.info
          npx lcov-result-merger 'lcov/lcov-*.info' lcov.info
      - name: Upload coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
