name: Nix

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

jobs:
  # `on.<event>.paths` is not supported by `merge_group`, and a workflow
  # skipped by path filters never reports its required checks, which blocks
  # the merge queue. Detect relevant changes in a job instead so that the
  # downstream jobs are skipped (and reported as successful) when nothing
  # relevant changed. `workflow_dispatch` runs always build.
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            nix:
              - "**/*.rs"
              - "**/Cargo.toml"
              - Cargo.lock
              - alioth-cli/cli.entitlements
              - "**/*.nix"
              - flake.lock
              - .github/workflows/nix.yml

  build_test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.nix == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build and test
        run: nix build --print-build-logs .#alioth .#vm
      # GitHub-hosted runners only support nested virtualization on x86_64
      # Linux
      - name: Enable KVM
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot a VM
        if: runner.os == 'Linux' && runner.arch == 'X64'
        env:
          ALIOTH_VM_CMDLINE: alioth.smoke-test
        # Explicitly enables pipefail
        shell: bash
        run: |
          # The console of Alioth requires a terminal
          timeout 120 script --quiet --return --command "nix run .#vm" /dev/null | tee vm.log
          grep -q '^alioth-smoke-test:' vm.log
